[project]
name = "coursebook-agent"
version = "0.1.0"
description = "基于智云课堂字幕的课程教辅生成智能体"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "python-dotenv",
    "pydantic",
    "pycryptodome>=3.20.0",
    "python-multipart",
    "python-pptx",
    "pypdf",
    "python-docx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
