<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程教辅 · 纸书预览</title>
<style>
  :root{
    --bg:#f6f1e6; --paper:#fffdf8; --ink:#2f2a22; --ink-soft:#4c4437;
    --sub:#8a7d66; --line:#e5dcc8; --line-strong:#cfc2a6;
    --accent:#8a5a2b; --accent-soft:#efe3cf;
    --example:#eef3f7; --example-line:#9db6c8;
    --procedure:#f2f6ec; --procedure-line:#8aa86a;
    --warning:#fdf0ec; --warning-line:#d98a76; --warning-ink:#9c4a32;
    --note:#faf6ec; --note-line:#d8c9a3;
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;
    --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);
       background-image:radial-gradient(circle at 20% 10%, rgba(138,90,43,.05), transparent 40%),
                        radial-gradient(circle at 85% 90%, rgba(138,90,43,.05), transparent 40%);}
  /* top progress */
  #progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--accent),#c99a5e);z-index:60;transition:width .1s linear}
  /* reading column */
  .page{max-width:820px;margin:0 auto;padding:52px 26px 120px}
  #content{background:var(--paper);padding:56px 64px 72px;border:1px solid var(--line);
           box-shadow:0 1px 4px rgba(90,70,40,.08),0 18px 50px -28px rgba(90,70,40,.35);
           border-radius:4px;line-height:1.95;font-size:17px;color:var(--ink)}
  @media(max-width:720px){#content{padding:34px 24px 48px}}
  #content > *:first-child{margin-top:0}

  /* ---- cover title ---- */
  .book-rendered > h1:first-child{font-family:var(--serif);text-align:center;font-size:38px;line-height:1.35;
    letter-spacing:2px;margin:8px 0 18px;color:var(--ink);font-weight:700}
  .book-rendered > h1:first-child + blockquote{border:none;background:transparent;text-align:center;
    font-size:13.5px;color:var(--sub);margin:0 0 34px;padding:0 26px;font-family:var(--sans)}
  /* ornamental divider under cover */
  .book-rendered > h1:first-child::after{content:"";display:block;width:120px;height:2px;
    margin:20px auto 0;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
  .book-rendered > h1:first-child + blockquote::after{content:"◆";display:block;color:var(--accent);
    font-size:12px;margin:14px auto 0;letter-spacing:0}

  /* ---- generic headings ---- */
  #content h1{font-size:27px;line-height:1.5;margin:66px 0 18px;padding-top:8px;color:var(--ink)}
  #content > hr + h1{margin-top:0}
  #content h1{position:relative}
  #content hr{border:0;height:0;margin:0 0 6px}
  /* chapter opening divider drawn via hr+h1 */
  #content > hr + h1{border-top:1px solid var(--line-strong);padding-top:52px;position:relative;text-align:left}
  #content > hr + h1::before{content:"";position:absolute;top:-6px;left:0;width:88px;height:11px;
    background:var(--paper);border-top:2px solid var(--accent)}
  #content h2{font-size:21px;margin:44px 0 14px;padding-left:14px;border-left:4px solid var(--accent);
    line-height:1.5;color:var(--ink)}
  #content h3{font-size:18px;margin:30px 0 10px;color:var(--ink-soft)}
  #content p{margin:14px 0}
  #content ul,#content ol{margin:12px 0;padding-left:1.6em}
  #content li{margin:7px 0}
  #content strong{color:var(--ink);font-weight:700}
  #content a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(138,90,43,.35)}
  #content a:hover{color:#5f3a17;border-color:var(--accent)}
  #content em{color:var(--ink-soft)}

  /* ---- callouts ---- */
  #content blockquote{margin:22px 0;padding:16px 20px 14px;border-radius:6px;position:relative;
    font-family:var(--sans);font-size:15.5px;line-height:1.85;background:#fff}
  #content blockquote p{margin:8px 0}
  #content blockquote p:first-child{margin-top:0}
  #content blockquote p:last-child{margin-bottom:0}
  #content blockquote.cq-example{background:var(--example);border:1px solid var(--example-line);border-left:5px solid #6f93ab}
  #content blockquote.cq-example::before{content:"例";position:absolute;top:-11px;left:14px;background:#5f86a0;color:#fff;
    font-size:12px;line-height:1;padding:5px 8px;border-radius:4px;font-weight:700;font-family:var(--sans)}
  #content blockquote.cq-procedure{background:var(--procedure);border:1px solid var(--procedure-line);border-left:5px solid var(--procedure-line)}
  #content blockquote.cq-procedure::before{content:"步骤";position:absolute;top:-11px;left:14px;background:#7d9e5c;color:#fff;
    font-size:12px;line-height:1;padding:5px 8px;border-radius:4px;font-weight:700;font-family:var(--sans)}
  #content blockquote.cq-warning{background:var(--warning);border:1px solid var(--warning-line);border-left:5px solid var(--warning-line)}
  #content blockquote.cq-warning::before{content:"易错";position:absolute;top:-11px;left:14px;background:var(--warning-ink);color:#fff;
    font-size:12px;line-height:1;padding:5px 8px;border-radius:4px;font-weight:700;font-family:var(--sans)}
  #content blockquote.cq-note{background:var(--note);border-left:4px solid var(--note-line)}
  #content blockquote.cq-note::before{content:"旁注";position:absolute;top:-11px;left:14px;background:#b6a46f;color:#fff;
    font-size:12px;line-height:1;padding:5px 8px;border-radius:4px;font-weight:700;font-family:var(--sans)}
  #content blockquote.cq-meta{border:none;background:transparent;text-align:center;color:var(--sub);
    font-family:var(--sans);font-size:14px;padding:0;margin:6px 0 20px}
  #content blockquote .cq-source{display:block;margin-top:8px;font-size:13px;color:var(--sub)}
  #content blockquote.cq-warning .cq-source{color:#a56a58}

  /* timeline chip */
  #content p.time-links{text-align:center;color:var(--sub);font-size:13px;margin:18px 0 26px;font-family:var(--sans)}
  #content p.time-links::before{content:"◷  ";color:var(--accent)}
  #content p.when-use{color:var(--sub);font-size:13.5px}

  /* divider rows */
  #content > hr{display:none}

  /* ---- floating toolbar ---- */
  .tools{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:50;display:flex;gap:6px;
    background:rgba(48,42,32,.92);color:#fff;padding:8px 10px;border-radius:999px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);font-family:var(--sans);backdrop-filter:blur(6px)}
  .tools button{border:0;background:transparent;color:#f3ead9;font-size:13.5px;padding:6px 10px;border-radius:999px;
    cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .tools button:hover{background:rgba(255,255,255,.16)}
  .tools .sep{width:1px;background:rgba(255,255,255,.25);margin:2px 2px}
  .tools .hint{font-size:12px;color:#cfc2a6;padding:0 6px;align-self:center}

  /* time jump links */
  #content p.time-links a{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px dashed rgba(138,90,43,.55);padding:0 1px}
  #content p.time-links a:hover{color:#5f3a17;border-bottom-style:solid}
  #content p.time-links .time-unlinked{cursor:pointer;border-bottom:1px dashed var(--sub);color:var(--ink-soft)}
  #content p.time-links .time-unlinked:hover{color:var(--accent);border-bottom-color:var(--accent)}
  #content p.time-links .time-sep{opacity:.5}

  /* drop overlay */
  #drop-zone{position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:14px;background:rgba(246,241,230,.94);
    display:none;align-items:center;justify-content:center;z-index:80;font-family:var(--sans);color:var(--accent);font-size:20px;letter-spacing:1px}
  #drop-zone.show{display:flex}

  /* print */
  @media print{
    body{background:#fff}
    #content{box-shadow:none;border:none;padding:0;font-size:12.5pt;line-height:1.8}
    .tools,#progress,#drop-zone{display:none !important}
    #content > hr + h1{page-break-before:always}
    #content blockquote{break-inside:avoid}
  }
</style>
</head>
<body>
<div id="progress"></div>

<main class="page">
  <article id="content" tabindex="-1"></article>
</main>

<div id="drop-zone">松开鼠标，载入你的 .md 文件</div>

<div class="tools">
  <button data-font="down" title="减小字号">A−</button>
  <button data-font="up" title="增大字号">A＋</button>
  <span class="sep"></span>
  <button id="btn-open" title="打开 .md 文件">打开 .md</button>
  <button id="btn-export" title="下载为单文件 HTML">导出 HTML</button>
  <button id="btn-print" title="打印 / 另存为 PDF">打印 / PDF</button>
  <button id="btn-top" title="回到顶部">回到顶部</button>
  <span class="sep"></span>
  <span class="hint">拖入 .md 换书 · 点灰色时间戳可配置视频跳转</span>
</div>

<input type="file" id="file-input" accept=".md,.markdown,.txt" style="display:none">

<script>
/* 运行时注入：讲次标题 -> 回放页地址 / mp4 直链（由后端 render_coursebook_html 写入） */

window.BOOK_VIDEO_FILES = __VIDEO_FILES_JSON__;
</script>

<script type="text/markdown" id="sample-md">__SAMPLE_MD__</script>
<script>__ENGINE_JS__</script>
<script>initBookViewer({ contentId:'content' });</script>
</body>
</html>
